# dsh-web-search-engine bundle patch —— 用多个搜索引擎替换 DSH 默认的搜索。
#
# 两件事：
#   1) 插入插件行：向 ctx.web 注册 id 为 web-search-multi 的搜索 provider；
#   2) 覆盖 web 行：把 searchProvider 指向它。
#      patch 会整体替换该行的 config（不做深合并），所以 fetchProvider 必须一并重申。
#
# 改回默认搜索：把下面 web 行的 searchProvider 改成 deepseek-official，
# 或在 profile 的 cordis.patch.yml 里再覆盖一次（用户层优先级更高）。

- insert:
    - id: web-search-multi
      name: 'dsh-web-search-engine'
      inject: [web]
      config:
        # merge=并行问所有引擎并把结果混合；fallback=按顺序试，第一个出结果就用。
        mode: merge
        # 引擎顺序（混合模式下决定同名次结果的先后）：
        #   HTTP 抓取：bing、duckduckgo、mojeek、google、brave
        #   浏览器取数：brave-web、ddg-web、google-web（需 browser.enabled）
        engines: [bing, duckduckgo, mojeek, google]
        # 每个引擎取多少条；混合后总条数更多，最终由 web_search 工具再截一次。
        maxResults: 6
        # 单次搜索的总预算（毫秒）：到点就用已经拿到的结果。
        timeoutMs: 12000
        language: zh-CN
        # Bing 的 mkt 市场参数，留空按出口 IP 判断（如 zh-CN、en-US）。
        region: ''
        safeSearch: true
        # 全局出站代理，留空直连。各引擎还能用 <engine>.proxy 单独指定。
        # 注意：Bing 会忽略这个值始终直连——走代理会落到 www.bing.com（国际版），
        # 同一个中文查询返回的结果集不同且慢一个数量级。要强制走代理请设 bing.proxy。
        proxy: ''
        bing:
          baseUrl: 'https://www.bing.com'
          # 结果页解析不到时，退回 Bing 的 RSS 结果流。
          rss: true
        duckduckgo:
          baseUrl: 'https://html.duckduckgo.com'
          region: cn-zh
          # DuckDuckGo 在直连网络下通常不可达，这里预填了本机代理（Clash 默认端口）。
          # 不用代理就清空；不填则回落到全局 proxy。
          proxy: 'http://127.0.0.1:7890'
        mojeek:
          baseUrl: 'https://www.mojeek.com'
          # Mojeek 对部分出口 IP 会要求人机验证，遇到时它只报错、不影响其它引擎。
          proxy: ''
        google:
          # 没配 apiKey + cx 时 Google 会被跳过（抓页已被它的 JS 门挡住）。
          apiKey: ''
          apiKeyEnv: GOOGLE_CSE_API_KEY
          cx: ''
          cxEnv: GOOGLE_CSE_CX
          allowHtmlFallback: false
          # www.googleapis.com 直连不通时填代理。
          proxy: 'http://127.0.0.1:7890'
        brave:
          # 需要 Brave Search API key，不填则跳过。
          apiKey: ''
          apiKeyEnv: BRAVE_SEARCH_API_KEY
        browser:
          # 浏览器取数：用本机 Chrome/Edge 渲染结果页再提取，给 HTTP 拿不到的引擎用。
          # 开启后 brave-web（无需 key，最划算）可用。
          enabled: false
          # 浏览器可执行文件；留空自动探测 Chrome → Edge。
          exe: ''
          # 无头模式（不弹窗口）。关掉会弹出一个浏览器窗口。
          headless: true
          # google-web 用有头模式：实测只有有头能过 Google 的自动化检测。
          headlessForGoogle: false
          # 浏览器专用代理；留空用上面的全局 proxy。
          proxy: ''
          # 持久 profile 目录，填了可跨搜索复用 Cookie。
          profileDir: ''
          # 空闲多久后自动关掉浏览器（毫秒）；0 = 不自动关。
          idleMs: 120000
          # 单个浏览器引擎最多等多久出结果（毫秒）。
          waitMs: 8000
          # 把浏览器调度日志打到 Host 控制台。
          verbose: false

- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: web-search-multi
    fetchProvider: http
